<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="720" height="490" fill="#fafafa"/>

  <!-- ======== FLEET LAYER ======== -->
  <rect x="30" y="20" width="660" height="190" rx="6" fill="white" stroke="#2c5f8a" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="30" y="20" width="660" height="36" rx="6" fill="#2c5f8a"/>
  <rect x="30" y="44" width="660" height="12" fill="#2c5f8a"/>
  <text x="360" y="44" text-anchor="middle" fill="white" font-size="14" font-weight="bold" letter-spacing="1">FLEET LAYER</text>

  <!-- Section dividers -->
  <line x1="250" y1="56" x2="250" y2="210" stroke="#cdd6e0" stroke-width="1"/>
  <line x1="470" y1="56" x2="470" y2="210" stroke="#cdd6e0" stroke-width="1"/>

  <!-- Section headers -->
  <rect x="30" y="56" width="220" height="22" fill="#e8f0f7"/>
  <rect x="250" y="56" width="220" height="22" fill="#e8f0f7"/>
  <rect x="470" y="56" width="220" height="22" fill="#e8f0f7"/>
  <text x="140" y="72" text-anchor="middle" fill="#2c5f8a" font-size="11" font-weight="bold">INPUT</text>
  <text x="360" y="72" text-anchor="middle" fill="#2c5f8a" font-size="11" font-weight="bold">CONTROL</text>
  <text x="580" y="72" text-anchor="middle" fill="#2c5f8a" font-size="11" font-weight="bold">EVALUATION</text>

  <!-- Fleet Input items -->
  <text x="140" y="96" text-anchor="middle" fill="#333" font-size="11">geo info</text>
  <text x="140" y="114" text-anchor="middle" fill="#333" font-size="11">ride-hail demand</text>
  <text x="140" y="132" text-anchor="middle" fill="#333" font-size="11">battery state</text>

  <!-- Fleet Control items -->
  <text x="360" y="96" text-anchor="middle" fill="#333" font-size="11">accept / reject (binary)</text>
  <text x="360" y="114" text-anchor="middle" fill="#333" font-size="11">charging rate (kW)</text>
  <text x="360" y="140" text-anchor="middle" fill="#888" font-size="10" font-style="italic">route: derived, not free</text>

  <!-- Fleet Evaluation items -->
  <text x="580" y="96" text-anchor="middle" fill="#333" font-size="11">demand fulfillment (%)</text>
  <text x="580" y="114" text-anchor="middle" fill="#333" font-size="11">V2B energy delivered (kWh)</text>

  <!-- ======== INTERFACE ARROW ======== -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <line x1="360" y1="215" x2="360" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Interface label box -->
  <rect x="225" y="222" width="270" height="28" rx="4" fill="#fff8e1" stroke="#e6a817" stroke-width="1.5"/>
  <text x="360" y="240" text-anchor="middle" fill="#7a5000" font-size="11" font-weight="bold">P_v2b(t)  [kW]  —  one-way</text>

  <!-- ======== BUILDING LAYER ======== -->
  <rect x="30" y="265" width="660" height="190" rx="6" fill="white" stroke="#2a6b3d" stroke-width="2"/>
  <!-- Header bar -->
  <rect x="30" y="265" width="660" height="36" rx="6" fill="#2a6b3d"/>
  <rect x="30" y="289" width="660" height="12" fill="#2a6b3d"/>
  <text x="360" y="289" text-anchor="middle" fill="white" font-size="14" font-weight="bold" letter-spacing="1">BUILDING LAYER</text>

  <!-- Section dividers -->
  <line x1="250" y1="301" x2="250" y2="455" stroke="#cdd6e0" stroke-width="1"/>
  <line x1="470" y1="301" x2="470" y2="455" stroke="#cdd6e0" stroke-width="1"/>

  <!-- Section headers -->
  <rect x="30" y="301" width="220" height="22" fill="#e8f3ec"/>
  <rect x="250" y="301" width="220" height="22" fill="#e8f3ec"/>
  <rect x="470" y="301" width="220" height="22" fill="#e8f3ec"/>
  <text x="140" y="317" text-anchor="middle" fill="#2a6b3d" font-size="11" font-weight="bold">INPUT</text>
  <text x="360" y="317" text-anchor="middle" fill="#2a6b3d" font-size="11" font-weight="bold">CONTROL</text>
  <text x="580" y="317" text-anchor="middle" fill="#2a6b3d" font-size="11" font-weight="bold">EVALUATION</text>

  <!-- Building Input items -->
  <text x="140" y="341" text-anchor="middle" fill="#333" font-size="11">weather (T_out)</text>
  <text x="140" y="359" text-anchor="middle" fill="#333" font-size="11">occupancy schedule</text>
  <text x="140" y="377" text-anchor="middle" fill="#333" font-size="11">building info (RC params)</text>
  <text x="140" y="395" text-anchor="middle" fill="#333" font-size="11">comfort range</text>

  <!-- Building Control items -->
  <text x="360" y="341" text-anchor="middle" fill="#333" font-size="11">temperature setpoint (°C)</text>
  <text x="360" y="367" text-anchor="middle" fill="#888" font-size="10" font-style="italic">bounded by comfort_range</text>
  <text x="360" y="385" text-anchor="middle" fill="#888" font-size="10" font-style="italic">× occupancy schedule</text>

  <!-- Building Evaluation items -->
  <text x="580" y="341" text-anchor="middle" fill="#333" font-size="11">comfort deviation (°C·h)</text>
  <text x="580" y="359" text-anchor="middle" fill="#333" font-size="11">peak demand reduction (kW)</text>

  <!-- ======== CROSS-LAYER METRIC ======== -->
  <rect x="170" y="468" width="380" height="16" rx="3" fill="#ede8f5" stroke="#6b4fa8" stroke-width="1"/>
  <text x="360" y="480" text-anchor="middle" fill="#6b4fa8" font-size="10.5" font-weight="bold">cross-layer:  V2B utilization rate = P_consumed / P_offered  (%)</text>
  <!-- Arrow from building to cross-layer -->
  <line x1="360" y1="458" x2="360" y2="465" stroke="#6b4fa8" stroke-width="1.2" stroke-dasharray="3,2"/>

</svg>
